<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse iPhones, Samsung phones, and accessories at King's Haven Store.">
  <title>Catalog — King's Haven Store</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/catalog.css">
</head>
<body data-page="catalog">
  <div class="page-wrapper">
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">King<span>'s Haven Store</span></a>
        <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle navigation">
          <span class="nav-toggle-icon"></span>
        </button>
        <nav class="main-nav" id="main-nav">
          <ul>
            <li><a href="index.html" data-nav="home">Home</a></li>
            <li><a href="catalog.html" data-nav="catalog">Catalog</a></li>
            <li><a href="location.html" data-nav="location">Location</a></li>
            <li><a href="about.html" data-nav="about">About</a></li>
            <li><a href="contact.html" data-nav="contact">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <h1 class="page-title">Product Catalog</h1>
        <p class="page-subtitle">iPhones, Samsung phones, and accessories — all in one place.</p>

        <div class="catalog-controls">
          <label for="search-input" class="sr-only">Search products</label>
          <input type="search" id="search-input" class="search-input" placeholder="Search iPhones, Samsung, accessories…" autocomplete="off">
          <label for="sort-select" class="sr-only">Sort products</label>
          <select id="sort-select" class="sort-select">
            <option value="name-asc">Name (A–Z)</option>
            <option value="name-desc">Name (Z–A)</option>
            <option value="price-asc">Price (Low to High)</option>
            <option value="price-desc">Price (High to Low)</option>
            <option value="rating-desc">Rating (Highest)</option>
          </select>
        </div>

        <div id="filter-pills" class="filter-pills"></div>
        <div id="brand-pills" class="filter-pills filter-pills--brands"></div>
        <p id="results-count" class="catalog-results-count"></p>
        <div id="catalog-grid"><p class="loading">Loading products…</p></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-brand">King's Haven Store</p>
        <nav class="footer-links">
          <a href="catalog.html">Catalog</a>
          <a href="location.html">Location</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
        <p class="footer-copy">&copy; 2026 King's Haven Store. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
